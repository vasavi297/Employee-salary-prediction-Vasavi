<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prediction Result</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #1e272e;
      --text-color: white;
      --box-color: #2f3640;
      --highlight: #00cec9;
    }

    body.light {
      --bg-color: #f5f5f5;
      --text-color: #2d3436;
      --box-color: #ffffff;
      --highlight: #0984e3;
    }

    body {
      margin: 0;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 40px;
      transition: background 0.3s, color 0.3s;
      overflow-x: hidden;
    }

    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background: var(--bg-color);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .top-bar a {
      color: var(--highlight);
      font-weight: bold;
      text-decoration: none;
      font-size: 16px;
      transition: 0.2s;
    }

    .top-bar a:hover {
      text-decoration: underline;
    }

    .toggle-btn {
      background: var(--box-color);
      color: var(--text-color);
      border: 1px solid var(--highlight);
      padding: 5px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .result-box {
      background: var(--box-color);
      padding: 30px;
      border-radius: 12px;
      display: inline-block;
      animation: fadeIn 0.8s ease-in;
    }

    h2, h1 {
      animation: slideDown 0.6s ease;
    }

    canvas {
      margin-top: 40px;
      max-width: 600px;
      animation: growIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes growIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Particle Background -->
  <canvas id="particles"></canvas>

  <div class="top-bar">
    <a href="/">← Home</a>
    
  </div>

  <div class="result-box">
    <h2>Predicted Salary for <strong>{{ job }}</strong>:</h2>
    <h1>₹ {{ salary }}</h1>
  </div>

  <canvas id="salaryChart"></canvas>

  <script>
    
    
    // Chart.js rendering
    const ctx = document.getElementById('salaryChart').getContext('2d');
    const salaryChart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: {{ jobs | tojson }},
        datasets: [{
          label: 'Average Salaries by Job Role',
          data: {{ values | tojson }},
          backgroundColor: '#00cec9'
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              color: getComputedStyle(document.body).getPropertyValue('--text-color')
            }
          },
          x: {
            ticks: {
              color: getComputedStyle(document.body).getPropertyValue('--text-color')
            }
          }
        },
        plugins: {
          legend: {
            labels: {
              color: getComputedStyle(document.body).getPropertyValue('--text-color')
            }
          }
        }
      }
    });

    // Particle background animation
    const canvas = document.getElementById('particles');
    const ctxBg = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];

    for (let i = 0; i < 80; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2 + 1,
        speedX: (Math.random() - 0.5) * 0.5,
        speedY: (Math.random() - 0.5) * 0.5
      });
    }

    function animateParticles() {
      ctxBg.clearRect(0, 0, canvas.width, canvas.height);
      for (let p of particles) {
        ctxBg.beginPath();
        ctxBg.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctxBg.fillStyle = 'rgba(0, 206, 201, 0.4)';
        ctxBg.fill();

        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
        if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
      }
      requestAnimationFrame(animateParticles);
    }

    animateParticles();

    // Resize canvas if window resizes
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>

</body>

</html>
