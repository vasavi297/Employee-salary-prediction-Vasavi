<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Employee Salary Prediction</title>
  <style>
    :root {
      --bg-color: #1e272e;
      --text-color: white;
      --box-color: #2f3640;
      --highlight: #00cec9;
    }

    body.light {
      --bg-color: #f5f5f5;
      --text-color: #2d3436;
      --box-color: #ffffff;
      --highlight: #0984e3;
    }

    body {
      margin: 0;
      background: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 50px 20px;
      transition: background 0.3s, color 0.3s;
      overflow-x: hidden;
    }

    #particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background: var(--bg-color);
    }

    .container {
      background: var(--box-color);
      padding: 40px;
      border-radius: 12px;
      display: inline-block;
      animation: fadeIn 1s ease;
    }

    h1 {
      margin-bottom: 30px;
      animation: slideDown 0.6s ease;
    }

    form select, input {
      padding: 10px;
      margin: 10px;
      border-radius: 6px;
      border: none;
      width: 250px;
      font-size: 16px;
    }

    input[type="submit"] {
      background-color: var(--highlight);
      color: white;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    input[type="submit"]:hover {
      background-color: #00b894;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .toggle-btn {
      background: var(--box-color);
      color: var(--text-color);
      border: 1px solid var(--highlight);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes slideDown {
      from { transform: translateY(-20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Particle Background -->
  <canvas id="particles"></canvas>
  <div class="container">
    <h1>Employee Salary Prediction</h1>
    <form method="POST" action="/">
      <select name="company" required>
        <option value="" disabled selected>Select Company</option>
        <option>Google</option>
        <option>Microsoft</option>
        <option>Facebook</option>
        <option>Amazon</option>
        <option>Netflix</option>
        <option>Apple</option>
      </select><br>

      <select name="job" required>
        <option value="" disabled selected>Select Job Role</option>
        <option>Data Scientist</option>
        <option>Software Engineer</option>
        <option>Web Developer</option>
        <option>Machine Learning Engineer</option>
        <option>Data Analyst</option>
      </select><br>

      <select name="degree" required>
        <option value="" disabled selected>Select Degree</option>
        <option>Bachelors</option>
        <option>Masters</option>
        <option>PhD</option>
      </select><br>

      <input type="number" name="experience" placeholder="Years of Experience" required><br>

      <input type="submit" value="Predict Salary">
    </form>
  </div>


   <script>

// Particle background animation
    const canvas = document.getElementById('particles');
    const ctxBg = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];

    for (let i = 0; i < 80; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2 + 1,
        speedX: (Math.random() - 0.5) * 0.5,
        speedY: (Math.random() - 0.5) * 0.5
      });
    }

    function animateParticles() {
      ctxBg.clearRect(0, 0, canvas.width, canvas.height);
      for (let p of particles) {
        ctxBg.beginPath();
        ctxBg.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctxBg.fillStyle = 'rgba(0, 206, 201, 0.4)';
        ctxBg.fill();

        p.x += p.speedX;
        p.y += p.speedY;

        if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
        if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
      }
      requestAnimationFrame(animateParticles);
    }

    animateParticles();

    // Adjust canvas size on resize
    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });
  </script>

</body>
</html>
